[project]
name = "audio-intelligence-agent"
version = "0.2.0"
description = "Ai_cheshm Audio Intelligence Agent plugin"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
dev = [
  "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
